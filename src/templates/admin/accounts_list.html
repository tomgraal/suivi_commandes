{% extends 'base.html' %}
{% block content %}
<h2>Comptes</h2>
<p><a href="{{ url_for('admin_account_new') }}" class="btn btn-primary">Nouveau compte</a></p>
<table class="table">
  <thead>
    <tr><th>Numéro</th><th>Description</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for a in accounts %}
    <tr>
      <td>{{ a.number }}</td>
      <td>{{ a.description }}</td>
      <td>
        <a href="{{ url_for('admin_account_edit', account_id=a.id) }}" class="btn btn-sm btn-secondary">Éditer</a>
        <form action="{{ url_for('admin_account_delete', account_id=a.id) }}" method="post" style="display:inline-block;">
          <button class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ?')">Supprimer</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3">Aucun enregistrement</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
