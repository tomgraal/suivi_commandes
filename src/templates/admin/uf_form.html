{% extends 'base.html' %}
{% block content %}
<h2>{% if uf %}Éditer UF{% else %}Nouvelle UF{% endif %}</h2>
<form method="post">
  <div class="form-group">
    <label>Code</label>
    <input name="code" class="form-control" value="{{ uf.code if uf else '' }}" required>
  </div>
  <div class="form-group">
    <label>Libellé</label>
    <input name="label" class="form-control" value="{{ uf.label if uf else '' }}" required>
  </div>
  <button class="btn btn-primary">Enregistrer</button>
  <a href="{{ url_for('admin_ufs') }}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
