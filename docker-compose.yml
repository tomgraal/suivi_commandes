version: '3.9'

services:
  web:
    build: .
    image: ght-ads-web
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:///data/app.db
      - UPLOAD_FOLDER=/app/uploads
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - 8000

  nginx:
    image: nginx:stable
    depends_on:
      - web
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
