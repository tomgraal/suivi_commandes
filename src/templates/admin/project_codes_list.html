{% extends 'base.html' %}
{% block content %}
<h2>Codes projet</h2>
<p><a href="{{ url_for('admin_project_code_new') }}" class="btn btn-primary">Nouveau code projet</a></p>
<table class="table">
  <thead>
    <tr><th>Code</th><th>Libellé</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for c in codes %}
    <tr>
      <td>{{ c.code }}</td>
      <td>{{ c.label }}</td>
      <td>
        <a href="{{ url_for('admin_project_code_edit', code_id=c.id) }}" class="btn btn-sm btn-secondary">Éditer</a>
        <form action="{{ url_for('admin_project_code_delete', code_id=c.id) }}" method="post" style="display:inline-block;">
          <button class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ?')">Supprimer</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="3">Aucun enregistrement</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
